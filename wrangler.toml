name = "burnfive"
main = "src/worker.js"
compatibility_date = "2025-11-01"

[[routes]]
pattern = "burnfive.daagamma.com"
custom_domain = true

[[kv_namespaces]]
binding = "GAMES"
id = "848a48ab87e542ddb7d41f0319b712ea"

# Скрипты игры отдаются браузеру как текст
[[rules]]
type = "Text"
