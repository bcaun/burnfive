<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde7ad" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2c2452" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Line Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: calm sunlit terrace above the sea, quiet iOS-native chrome
   IDEA: painted stone blocks on a terracotta slab; the game supplies all colour, the chrome stays in ink
   PICTURE: the slab with a visible side; cubes with lit tops, shaded sides and a symbol per colour
   COLOUR and TYPE: butter, peach and mint sky with a sun disc and terrace silhouettes; dusk at night; SF Pro Rounded / Nunito
   LAYOUT: large title, segmented controls, status strip over the board on phones, solid cards beside it on desktop */
:root{color-scheme:light dark;
--sky1:light-dark(#fde7ad,#2c2452);--sky2:light-dark(#fbcfae,#4b3168);--sky3:light-dark(#cdeedd,#1f3e52);--sun:light-dark(#fff8e1,#ffe7c4);
--ink:light-dark(#3b2a3f,#f4ecff);--mute:light-dark(#634e66,#cfc3e0);--sep:light-dark(rgba(59,42,63,.12),rgba(255,255,255,.12));
--card:light-dark(#fffaf2,#2a2248);--cardb:light-dark(rgba(59,42,63,.07),rgba(255,255,255,.07));--sheet:light-dark(#fffaf3,#2d2550);
--slab:light-dark(#fff3e6,#3d3060);--slabside:light-dark(#e9a283,#211936);--hot:light-dark(#dc5a40,#7f2b3c);
--well:light-dark(#f6e2cf,#33284f);--wellsh:light-dark(rgba(150,90,60,.2),rgba(0,0,0,.32));
--seg:light-dark(rgba(59,42,63,.08),rgba(255,255,255,.1));--segOn:light-dark(#fffaf3,#5d547e);--btn:light-dark(#3b2a3f,#fff3e6);--onbtn:light-dark(#fff8ef,#2c2452);
--far:light-dark(#f4c3a2,#33285a);--far2:light-dark(#f7d6bd,#2f2655);--ring:light-dark(#fffaf3,#fff3e6);--dim:light-dark(rgba(253,231,173,.45),rgba(44,36,82,.5));
--r:#e5533d;--rl:#ff8a6e;--rs:#b23a28;--y:#f6bd3c;--yl:#ffda7a;--ys:#c98a12;--g:#3cc49c;--gl:#82e5c5;--gs:#219778;--b:#5b48c9;--bl:#8c7bf0;--bs:#3d2e9a;
--st:light-dark(#bab4c5,#8f889e);--stl:light-dark(#dad5e2,#aaa3b8);--sts:light-dark(#8a8398,#5e576d);
--xb:light-dark(#3b2e52,#efe6ff);--xl:light-dark(#58486f,#ffffff);--xs:light-dark(#221a33,#b5a6d6);--xi:light-dark(#fff3e6,#3b2e52);
--col1:light-dark(#c9694a,#9b4a35);--col2:light-dark(#eb9c78,#c46e50);--colcap:light-dark(#f6cfb4,#d99a7c);--colcaps:light-dark(#c77a57,#8e4630);
--ice1:light-dark(#ebf8ff,#3f6890);--ice2:light-dark(#bfe2f6,#2c4a70);--iceb:light-dark(rgba(110,170,215,.55),rgba(150,200,240,.35));
--kshadow:light-dark(rgba(70,30,20,.45),rgba(0,0,0,.6));--dotbg:light-dark(#3b2a3f,#fff3e6);--dotfg:light-dark(#fff3e6,#3b2a3f);
--pc1:light-dark(#7b67e6,#a796ff);--pc2:light-dark(#1f9e7c,#5fe0b8);
--rounded:ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;
 background:radial-gradient(circle at 86% 64px,var(--sun) 0 30px,transparent 31px),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 52%,var(--sky3) 100%) fixed}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body{background:radial-gradient(circle at 86% 64px,var(--sun) 0 18px,transparent 19px),radial-gradient(circle at 20% 110px,rgba(255,255,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 62% 30px,rgba(255,255,255,.45) 0 1px,transparent 2px),radial-gradient(circle at 40% 180px,rgba(255,255,255,.35) 0 1px,transparent 2px),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) fixed}}
:root[data-theme=dark] body{background:radial-gradient(circle at 86% 64px,var(--sun) 0 18px,transparent 19px),radial-gradient(circle at 20% 110px,rgba(255,255,255,.55) 0 1px,transparent 2px),radial-gradient(circle at 62% 30px,rgba(255,255,255,.45) 0 1px,transparent 2px),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) fixed}
.far{position:fixed;left:0;right:0;bottom:0;width:100%;height:300px;pointer-events:none;z-index:0}
.far .f1{fill:var(--far2)}.far .f2{fill:var(--far)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin:22px 0 12px;max-width:600px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg.lang{flex:none;min-height:32px;margin-right:72px}.seg.lang button{flex:none;min-width:40px;padding:0 8px;font-size:13px}
h1{font:900 34px/1.1 var(--rounded);letter-spacing:-.01em;margin:0}
.seg{display:flex;padding:2px;border-radius:12px;background:var(--seg);min-height:44px;gap:2px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:10px;font:600 15px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);min-width:64px;padding:0 12px;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;transition:background .2s,box-shadow .2s}
.seg button[aria-pressed=true]{background:var(--segOn);box-shadow:0 2px 6px rgba(30,15,40,.14),0 1px 1px rgba(30,15,40,.05)}
.seg button:focus-visible,button.act:focus-visible,.lv:focus-visible{outline:3px solid color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:2px}
.seg.size{flex:none}.seg.size button{flex:none}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;max-width:600px}
.tools #undo{margin-left:auto}
.tools .lab{font-size:15px;color:var(--mute)}
button.act{appearance:none;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--btn);color:var(--onbtn);font:700 16px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .12s}
button.act:active{transform:scale(.96)}
button.act.ghost{background:var(--seg);color:var(--ink)}
button.act.icon{width:44px;padding:0}
button.act:disabled{opacity:.4;cursor:default}
button.act svg{width:22px;height:22px}
.game{display:grid;grid-template-columns:minmax(0,600px) 320px;gap:clamp(20px,3vw,40px);align-items:start}
/* плита и поле */
.boardbox{position:relative;width:100%;max-width:600px;aspect-ratio:1;border-radius:22px;background:var(--slab);container-type:inline-size;transition:box-shadow .6s;
 box-shadow:0 12px 0 var(--side,var(--slabside)),0 30px 40px -16px rgba(110,50,30,.45),inset 0 1px 0 rgba(255,255,255,.65)}
#board{position:absolute;inset:0;display:grid;padding:8px;gap:4px;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));grid-template-rows:repeat(var(--n,8),minmax(0,1fr));font-size:9.8px;font-size:calc((100cqw - 16px) / var(--n,8) * .233);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.c{appearance:none;border:0;padding:0;margin:0;position:relative;border-radius:24%;background:var(--well);box-shadow:inset 0 .22em 0 var(--wellsh);font:inherit;color:inherit;display:block;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.c:focus-visible{box-shadow:inset 0 0 0 .2em var(--ink)}
.c.s{z-index:3}
.c.t::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--ink);opacity:.3;z-index:3}
.c.t:has(.k)::after{inset:-6%;border-radius:30%;background:none;border:.2em solid var(--ink);opacity:.32;z-index:4}
.r{--kb:var(--r);--kl:var(--rl);--ks:var(--rs);--sf:#ffffff}
.y{--kb:var(--y);--kl:var(--yl);--ks:var(--ys);--sf:#9a5f05}
.g{--kb:var(--g);--kl:var(--gl);--ks:var(--gs);--sf:#0e5c48}
.b{--kb:var(--b);--kl:var(--bl);--ks:var(--bs);--sf:#ffffff}
.k{position:absolute;inset:4% 4% 2%;border-radius:24%;background:linear-gradient(165deg,var(--kl) 0%,var(--kb) 56%);box-shadow:inset 0 -.85em 0 var(--ks),inset 0 .14em 0 rgba(255,255,255,.45),0 .3em .45em -.15em var(--kshadow);display:block;z-index:1;transition:transform .16s cubic-bezier(.3,1.4,.5,1)}
.k .sym{position:absolute;left:28%;top:16%;width:44%;height:44%;fill:var(--sf);stroke:var(--sf);stroke-width:1.4;stroke-linejoin:round;overflow:visible}
.c.s .k{transform:translateY(-12%) scale(1.06);box-shadow:inset 0 -.85em 0 var(--ks),inset 0 .14em 0 rgba(255,255,255,.5),0 0 0 .24em var(--ring),0 1.1em 1.1em -.4em rgba(60,25,20,.5)}
.k .crk{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:rgba(40,22,46,.55);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.k .crk.h{stroke:rgba(40,22,46,.72);stroke-width:2.1}
.k .ring{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke-linecap:round}
.k .ring .tr{stroke:rgba(30,15,30,.16);stroke-width:2.6}
.k .ring .ar{stroke:var(--sf);stroke-width:2.6;transition:stroke-dasharray .3s}
.k.cr.hot{filter:saturate(.8)}
.hotb{position:absolute;right:-10%;top:-12%;height:38%;min-width:38%;padding:0 .28em;border-radius:999px;background:var(--dotbg);display:flex;align-items:center;justify-content:center;gap:.18em;box-shadow:0 .1em .25em rgba(0,0,0,.3);z-index:2}
.hotb i{width:.5em;height:.5em;border-radius:50%;background:var(--dotfg);display:block}
.k.S{--kb:var(--st);--kl:var(--stl);--ks:var(--sts);background:linear-gradient(165deg,var(--kl),var(--kb) 60%);clip-path:polygon(0 0,74% 0,100% 20%,100% 100%,0 100%);box-shadow:inset 0 -.85em 0 var(--ks),inset 0 .14em 0 rgba(255,255,255,.25)}
.k.S .crk{stroke:rgba(50,40,60,.6);stroke-width:1.9}
.k.J{background:conic-gradient(from 45deg at 50% 40%,var(--r) 0 25%,var(--y) 0 50%,var(--g) 0 75%,var(--b) 0);box-shadow:inset 0 -.85em 0 rgba(30,15,40,.28),inset 0 .14em 0 rgba(255,255,255,.4),0 .3em .45em -.15em var(--kshadow)}
.k.J .jc{position:absolute;left:31%;top:20%;width:38%;height:38%;border-radius:50%;background:#fff;box-shadow:0 .08em .2em rgba(0,0,0,.25);display:block}
.k.X{--kb:var(--xb);--kl:var(--xl);--ks:var(--xs)}
.k.X .sym{fill:var(--xi);stroke:var(--xi);left:22%;top:10%;width:56%;height:56%}
.seed{position:absolute;inset:27%;border-radius:26%;background:linear-gradient(165deg,var(--kl),var(--kb) 60%);opacity:.6;box-shadow:inset 0 -.3em 0 var(--ks);z-index:1;animation:seedin .3s ease-out}
.seed::after{content:"";position:absolute;inset:-32%;border-radius:36%;border:.14em dashed var(--ks);opacity:.9}
.seed .sym{position:absolute;left:24%;top:16%;width:52%;height:52%;fill:var(--sf);stroke:var(--sf);stroke-width:1.4;stroke-linejoin:round}
@keyframes seedin{from{transform:scale(.3);opacity:0}}
/* ландшафт */
.c.t-P{background:transparent;box-shadow:none;cursor:default}
.col{position:absolute;left:18%;right:18%;top:-14%;bottom:6%;border-radius:.35em .35em .5em .5em;background:repeating-linear-gradient(90deg,rgba(60,20,10,.12) 0 9%,transparent 9% 24%),linear-gradient(90deg,var(--col1),var(--col2) 42%,var(--col1));box-shadow:0 .35em .5em -.15em rgba(80,35,20,.45);z-index:2}
.col::before{content:"";position:absolute;left:-22%;right:-22%;top:-6%;height:24%;border-radius:.3em;background:linear-gradient(180deg,var(--colcap),var(--col2));box-shadow:inset 0 -.32em 0 var(--colcaps)}
.col::after{content:"";position:absolute;left:-14%;right:-14%;bottom:-8%;height:16%;border-radius:.25em;background:var(--colcaps)}
.c.t-I{background:linear-gradient(135deg,var(--ice1),var(--ice2));box-shadow:inset 0 0 0 1px var(--iceb)}
.c.t-I::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,transparent 28%,rgba(255,255,255,.8) 38%,transparent 47%,transparent 60%,rgba(255,255,255,.55) 65%,transparent 71%)}
.t-O1{--pc:var(--pc1);--pf:color-mix(in srgb,var(--pc1) 22%,transparent)}.t-O2{--pc:var(--pc2);--pf:color-mix(in srgb,var(--pc2) 22%,transparent)}
.arch{position:absolute;inset:6%;width:88%;height:88%;overflow:visible}
.arch .ap{fill:var(--pf);stroke:var(--pc);stroke-width:3.2;stroke-linejoin:round}
.arch .ad{fill:var(--pc)}
.paint{position:absolute;inset:8%;width:84%;height:84%}
.paint .pb{fill:var(--kb);opacity:.62}
.paint .ps{fill:var(--sf);stroke:var(--sf);opacity:.9}
.tile{position:relative;display:inline-block;width:32px;height:32px;font-size:7.5px;flex:none}
/* анимации */
.k.pop{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(-40%) scale(.4);opacity:0}to{transform:none;opacity:1}}
.k.burn{animation:burn .26s ease-in forwards}
@keyframes burn{0%{transform:scale(1)}40%{transform:scale(1.1);filter:brightness(1.3) saturate(.75)}100%{transform:scale(.7);opacity:0;filter:brightness(1.4) saturate(.6)}}
.sand{position:absolute;width:20%;height:20%;border-radius:22%;background:var(--kl);z-index:2;opacity:.85;animation:sand .45s ease-out forwards;pointer-events:none}
@keyframes sand{to{transform:translate(var(--sx),var(--sy)) scale(.4);opacity:0}}
.k.petrify{animation:petrify .3s ease-out}
@keyframes petrify{from{filter:brightness(1.8) saturate(.2);transform:scale(1.12)}to{filter:none;transform:none}}
.k.flash{animation:flash .35s ease-out}
@keyframes flash{from{filter:brightness(1.7)}to{filter:none}}
.k.nudge{transform:translate(var(--nx),var(--ny))!important;transition:transform .12s ease-out}
.k.wig{animation:wig 1.4s ease-in-out}
@keyframes wig{0%,100%{transform:none}15%,45%{transform:translate(var(--nx),var(--ny)) rotate(-7deg)}30%,60%{transform:rotate(5deg)}}
.float{position:absolute;font:900 30px/1 var(--rounded);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%);color:var(--ink);-webkit-text-stroke:7px var(--slab);paint-order:stroke fill;letter-spacing:-.01em;z-index:7;animation:up 1s ease-out forwards}
.float.s{font-size:24px}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
/* строка состояния и карточки */
.hud{display:none}
aside{display:grid;gap:12px}
.score,.tempo,.rules,.pts{background:var(--card);border:1px solid var(--cardb);border-radius:20px;padding:14px 16px}
.big{font:900 40px/1 var(--rounded);font-variant-numeric:tabular-nums;margin:4px 0 6px}
.lab{font-size:13px;line-height:1.3;color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.next{display:flex;gap:10px;align-items:center;margin-top:8px}
.ico{position:relative;display:inline-block;width:40px;height:40px;flex:none;font-size:10px}
.ico .k{inset:0}
.ico.sm{width:30px;height:30px;font-size:7.5px;opacity:.7}
.ico.xs{width:24px;height:24px;font-size:6px}
.trip{display:inline-flex;gap:2px;flex:none}.trip .ico{width:11px;height:22px;font-size:3.6px}.trip .k{border-radius:3px}
.tempo .row:first-child{font-weight:600}
.bonus{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--sep)}
.rules{font-size:15px}.rules ul{margin:6px 0 0;padding-left:18px}.rules li{margin:5px 0}
.legend{list-style:none;padding:8px 0 0!important;border-top:1px solid var(--sep);margin-top:10px!important}.legend li{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;margin:10px 0}
.tiles{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;margin:8px 0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px;margin-top:4px}
td{padding:7px 0;border-bottom:1px solid var(--sep)}tr:last-child td{border-bottom:0}td:last-child{text-align:right;color:var(--mute)}
.goal{font:800 19px/1.25 var(--rounded);margin:4px 0 10px}
.bar{height:8px;border-radius:999px;background:var(--seg);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--ink);transition:width .3s}
.hint{font-size:15px;line-height:1.4}
.lb{list-style:none;margin:8px 0 0;padding:0;counter-reset:n}
.lb li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--sep);font-size:15px;font-variant-numeric:tabular-nums;counter-increment:n}
.lb li::before{content:counter(n);color:var(--mute);font-weight:700}
.lb li:last-child{border-bottom:0}.lb li.none{grid-template-columns:1fr auto;color:var(--mute)}.lb li.none::before{content:none}
.lb li.me{font-weight:800}.lb li.me::before{color:var(--ink)}
.lb li.me span:first-child::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:8px;vertical-align:middle}
.lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nick{display:block;margin-top:10px}
.nick input{width:100%;height:44px;border:0;border-radius:12px;background:var(--seg);color:var(--ink);padding:0 12px;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
.nick input::placeholder{color:var(--mute)}
.nick input:focus{outline:3px solid color-mix(in srgb,var(--ink) 35%,transparent)}
/* лист окончания */
.over{position:absolute;inset:0;display:none;place-items:center;border-radius:22px;background:var(--dim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-align:center;z-index:6}
.over.on{display:grid}
.over>div{width:min(300px,calc(100% - 32px));background:var(--sheet);border-radius:26px;padding:24px 22px 22px;box-shadow:0 24px 50px -22px rgba(50,25,60,.55),0 0 0 1px var(--cardb)}
.over .mark{width:52px;height:52px;margin:0 auto 12px;position:relative;font-size:13px}
.over .mark .k{inset:0}
.over h2{font:900 28px/1.1 var(--rounded);margin:0 0 8px;letter-spacing:-.01em}
.over p{margin:0 0 18px;color:var(--mute);font-size:15px;line-height:1.4}
.over .btns{display:flex;gap:10px;justify-content:center}.over .btns .act{flex:1}
/* выбор уровня */
.lvpick{position:absolute;inset:0;z-index:5;border-radius:22px;padding:14px;background:var(--slab);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}
.lv{appearance:none;border:0;border-radius:18px;background:var(--well);box-shadow:inset 0 3px 0 var(--wellsh);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:4px;cursor:pointer}
.lv b{font:900 26px/1 var(--rounded)}
.lv span{font-size:13px;line-height:1.15;color:var(--mute);text-align:center}
.lv.cur{box-shadow:inset 0 0 0 2.5px var(--ink)}
.lv:disabled{opacity:.42;cursor:default}
.lv .badge{position:absolute;top:7px;right:8px;width:16px;height:16px;fill:none;stroke:var(--mute);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lv.done .badge{stroke:var(--gs)}
#side.picking>*:not(#hintcard){display:none!important}
#side.picking #hintcard{grid-column:1/-1}
.hud .bar{display:inline-block}
@media(max-width:760px){
 .game{grid-template-columns:minmax(0,1fr)}
 .boardbox{max-width:none;margin-bottom:12px}
 aside{grid-template-columns:1fr 1fr}
 .rules,.pts,.tempo,#goalcard,#hintcard,.wide{grid-column:1/-1}
 .hud{display:flex;grid-column:1/-1;align-items:center;justify-content:space-between;gap:10px;min-height:60px;padding:0 14px;border-radius:18px;background:var(--card);border:1px solid var(--cardb)}
 .hud .lab{display:block;margin-bottom:3px}
 .hud .num{font:900 26px/1 var(--rounded);font-variant-numeric:tabular-nums}
 .hud .next{margin:0;gap:8px}.hud .ico{width:30px;height:30px;font-size:7.5px}.hud .ico.sm{width:22px;height:22px;font-size:5.5px}
 .hud .hb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);white-space:nowrap}
 .dup{display:none!important}
}
@media(prefers-reduced-motion:reduce){.k,.k.pop,.k.burn,.k.petrify,.k.flash,.k.wig,.float,.seed,.sand{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg class="far" viewBox="0 0 390 300" preserveAspectRatio="none" aria-hidden="true"><path class="f1" d="M0 150h60v-24h70v-30h80v30h60v-18h60v26h60V300H0Z"/><path class="f2" d="M0 210h40v-20h90v-26h70v26h80v-14h110V300H0Z"/></svg>
<div class="wrap">
<header>
 <div class="titlerow"><h1>Line Blast</h1><div class="seg lang" role="group" data-ta="lang"><button data-l="en">EN</button><button data-l="ru">RU</button></div></div>
 <div class="seg mode" role="group" data-ta="mode"><button data-m="e" data-t="mGame"></button><button data-m="l" data-t="mLevels"></button><button data-m="d" data-t="mDay"></button></div>
</header>
<div class="tools">
 <div class="seg size" role="group" data-ta="boardSize" data-show="e"><button data-n="8">8×8</button><button data-n="10">10×10</button></div>
 <button class="act" id="new" data-show="e" data-t="newGame"></button>
 <button class="act ghost" id="tolevels" data-show="l" data-t="allLevels"></button>
 <button class="act" id="relevel" data-show="l" data-t="restart"></button>
 <span class="lab" id="daylab" data-show="d"></span>
 <button class="act" id="reday" data-show="d" data-t="restart"></button>
  <button class="act ghost icon" id="undo" disabled data-ta="undo" data-tt="undoTitle"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 4 9l5 5"/><path d="M4.5 9H14a6 6 0 0 1 0 12h-3"/></svg></button>
</div>
<div class="game">
 <div class="hud" id="hud"><div><span class="lab" id="hlab"></span><span class="num" id="hscore">0</span></div><div class="next" id="hnext"></div><div class="hb" id="hbonus"></div></div>
 <div class="boardbox">
  <div id="board" role="grid"></div>
  <div class="lvpick" id="lvpick" hidden></div>
  <div class="over" id="over"><div><div class="mark" id="overmark" hidden></div><h2 id="overh"></h2><p id="overtxt"></p><div class="btns"><button class="act ghost" id="over2" hidden></button><button class="act" id="over1"></button></div></div></div>
 </div>
 <aside id="side">
  <div class="score" data-show="l" id="goalcard">
   <div class="lab" id="lvname"></div>
   <div class="goal" id="goaltxt"></div>
   <div class="bar"><i id="goalbar"></i></div>
   <div class="row lab" style="margin-top:8px"><span id="goalnum"></span><span id="movesleft"></span></div>
  </div>
  <div class="score dup" data-show="e d">
   <div class="lab" data-t="score"></div>
   <div class="big" id="score">0</div>
   <div class="row lab"><span id="bestlab"></span><span id="best">0</span></div>
  </div>
  <div class="score dup">
   <div class="lab" data-t="next"></div>
   <div class="next" id="next"></div>
  </div>
  <div class="tempo">
   <div class="row"><span><span data-t="turn"></span> <b id="turn">0</b></span><span id="fill"></span></div>
   <div class="lab" id="phase"></div>
   <div class="row lab" style="margin-top:8px"><span data-t="afterMove"></span><span id="incoming"></span></div>
   <div class="row lab"><span data-t="linesBurned"></span><span id="lines">0</span></div>
   <div class="bonus" id="bonusrow"><span id="bicon"></span><span class="lab" id="btxt"></span></div>
  </div>
  <div class="score hint" data-show="l" id="hintcard"></div>
  <div class="score wide" data-show="d">
   <div class="lab" data-t="topToday"></div>
   <ol class="lb" id="lb"></ol>
   <label class="nick"><input id="nick" maxlength="16" data-tp="nickPh" autocomplete="nickname"></label>
  </div>
  <div class="rules">
   <b data-t="rules"></b>
   <ul id="rules"></ul>
   <div id="terrainlegend"></div>
   <ul class="legend" id="bonuslegend">
    <li><span class="ico xs"><span class="k J"></span></span><span data-th="legendJ"></span></li>
    <li><span class="trip"><span class="ico"><span class="k g"></span></span><span class="ico"><span class="k g"></span></span><span class="ico"><span class="k g"></span></span></span><span data-th="legendT"></span></li>
    <li><span class="ico xs"><span class="k X"></span></span><span data-th="legendX"></span></li>
   </ul>
  </div>
  <div class="pts">
   <b data-t="ptsTitle"></b>
   <table><tbody id="pts"></tbody></table>
  </div>
 </aside>
</div>
</div>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
